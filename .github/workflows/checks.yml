name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lifhop_test
          POSTGRES_USER: lifhop
          POSTGRES_PASSWORD: lifhop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifhop -d lifhop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lifhop:lifhop@localhost:5432/lifhop_test
      TEST_DATABASE_URL: postgresql+psycopg://lifhop:lifhop@localhost:5432/lifhop_test
      JWT_SECRET_KEY: isolated-ci-test-secret
      AWS_REGION: ap-northeast-2
      SQS_IMPORT_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test
      S3_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -c "import json; from app.main import app; open('openapi.json', 'w').write(json.dumps(app.openapi()))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx openapi-typescript ../openapi.json -o src/api/generated/schema.ts
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/generated/schema.ts
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
