services:
  test-db:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    environment:
      POSTGRES_DB: lifhop_test
      POSTGRES_USER: lifhop
      POSTGRES_PASSWORD: lifhop
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifhop -d lifhop_test"]
      interval: 2s
      timeout: 5s
      retries: 15
